# ATLAS profile trader (frontier tier). Hermes trading the MT5 demo account itself
# through atlas-trading (docs/hermes-trader.md). The model is written per tier by
# deploy/hermes/bootstrap.py from deploy/hermes/models.yaml. Host-wide pins
# (Docker network, approvals, disabled toolsets) come from Managed Scope:
# deploy/hermes/managed/config.yaml. The `atlas` plugin (H3 audit and alert hooks)
# is installed into every profile by bootstrap.py and enabled here.
# MCP servers come from roster.yaml; ${...} values are filled from the profile's
# .env, which bootstrap.py writes with one scoped API token per server.
# atlas-trading and atlas-operations call the engine API, so their URL is ATLAS_ENGINE_URL.
# The engine refuses every agent trade unless the broker reports a demo account.
terminal:
  backend: docker
  docker_network: true
  container_persistent: true
  container_cpu: 1
  container_memory: 4096
  docker_mount_cwd_to_workspace: false
approvals:
  mode: manual
  cron_mode: deny
  unattended_mode: deny
  single_query_mode: deny
  deny:
  - '*config/risk*'
  - '*prop_rules*'
  - '*config/strategies*'
platform_toolsets:
  cli:
  - web
  - skills
  - memory
  - session_search
  - todo
  - atlas-trading
  - atlas-operations
  cron:
  - web
  - skills
  - memory
  - session_search
  - todo
  - atlas-trading
  - atlas-operations
kanban:
  dispatch_in_gateway: false
  notify_in_gateway: false
mcp_servers:
  atlas-trading:
    command: ${ATLAS_MCP_PYTHON}
    args:
    - -m
    - atlas_mcp
    - atlas-trading
    env:
      ATLAS_API_URL: ${ATLAS_ENGINE_URL}
      ATLAS_ENGINE_TOKEN: ${ATLAS_TOKEN_TRADING}
    timeout: 60
    tools:
      include:
      - get_live_market
      - submit_trade_intent
      - get_intent_status
      - list_my_positions
      - close_my_position
      - tighten_stop
      - my_track_record
      resources: false
      prompts: false
  atlas-operations:
    command: ${ATLAS_MCP_PYTHON}
    args:
    - -m
    - atlas_mcp
    - atlas-operations
    env:
      ATLAS_API_URL: ${ATLAS_ENGINE_URL}
      ATLAS_ENGINE_TOKEN: ${ATLAS_TOKEN_OPERATIONS}
    timeout: 60
    tools:
      include:
      - system_status
      - health_state
      resources: false
      prompts: false
plugins:
  enabled:
  - atlas
tools:
  tool_search:
    enabled: 'off'
