# Phase T0 edge discovery for the CME Micro E-mini S&P 500 future (MES).
# Same harness, segments, gates and account placeholders as t0.yaml; only the
# market, its costs and the strategies differ. Results: docs/mes-candidates.md.
#
#   atlas-research data download --symbols USA500IDXUSD
#   atlas-research data build    --symbols USA500IDXUSD
#   atlas-research --config atlas_research/configs/mes.yaml t0 run --all
#
# There is no futures history in the repo, so MES is proxied by Dukascopy's
# S&P 500 cash-index CFD (USA500IDXUSD, index points). The proxy's mid price is
# kept and re-quoted at the future's one-tick spread: the CFD's own spread
# (about 0.45 points, ~2 ticks) is a dealer markup the future doesn't have, and
# charging it on top of the futures slippage below would count spread twice.

data:
  source: dukascopy
  root: data
  raw_cache: data/raw/dukascopy
  proxies:
    MES: {source: USA500IDXUSD, spread: 0.25}   # one MES tick

segments:              # identical to t0.yaml; the holdout stays locked
  dev: ["2019-01-01", "2024-01-01"]
  validation: ["2024-01-01", "2025-07-01"]
  holdout_start: "2025-07-01"

walk_forward:
  train_months: 12
  test_months: 3
  min_train_trades: 30

costs:
  spread_mult: 1.5         # §22 stress: the 1-tick spread is charged as 1.5 ticks
  stress_spread_mult: 2.0  # §15: must stay positive at 2x spread (2 ticks)
  # Index points per contract. MES: tick 0.25 pt = $1.25, $5 per point.
  # Round turn $1.50 (NinjaTrader is ~$1.24 commission + exchange/NFA fees) = 0.30 pt.
  # 1 tick slippage on every market fill: entries, stops, time exits and
  # flattens. Profit targets are resting limit orders: no slippage. No swap.
  per_symbol:
    MES: {commission_rt: 0.30, entry_slippage: 0.25, stop_slippage: 0.25, exit_slippage: 0.25, swap_per_rollover: 0.0}

exits:
  rr: 2.0
  friday_flatten_utc: "20:00"   # no weekend holding (CME closes Friday 17:00 New York)

filters:
  max_spread_to_stop: 0.20
  after_open_minutes: 15
  friday_no_entry_after_utc: "18:00"

account:        # T0 placeholders, unchanged, so results compare with the FX rounds
  risk_pct: 0.40
  firm_max_drawdown_pct: 10.0
  firm_daily_loss_pct: 5.0
  eval_days: 30

gates:
  min_oos_trades: 300
  min_expectancy_r: 0.10
  min_profit_factor: 1.25
  max_dd_frac_of_firm: 0.60
  max_daily_breach_prob: 0.02
  min_dsr: 0.95
  min_wfe: 0.50
  max_year_share: 0.40
  mc_sims: 10000
  random_control_runs: 50
  neighborhood: 0.20

budget:
  experiments_per_strategy_per_month: 20

# MES round 1 (declared 2026-10-06, before any MES data was loaded or run).
# Grids are 4 points each, fixed before any result; each grid point is a
# deflated-Sharpe trial, pooled with every earlier trial of the same setup.
strategies:
  mes_orb_m15:
    setup: opening_range_breakout
    bar: 15min
    hypothesis: "The first M15 close beyond the US cash-open range (09:30 New York) continues far enough to pay 2R after futures costs before 15:55 New York."
    symbols: [MES]
    exits:
      rr: 2.0
      friday_flatten_utc: null   # intraday: the setup's own 15:55 New York time exit closes every trade
    grid:
      range_minutes: [15, 30]
      sl_range_frac: [0.5, 1.0]
  mes_channel_breakout_h4:
    setup: channel_breakout
    bar: 4h
    hypothesis: "An H4 close beyond the N-bar high or low of the S&P 500 starts a multi-day move often enough to pay 2R after futures costs."
    symbols: [MES]
    grid:
      channel: [20, 55]
      sl_atr: [1.5, 2.5]
  mes_trend_pullback_h1:
    setup: trend_pullback
    bar: 1h
    hypothesis: "H1 pullbacks into the fast EMA resume the H1 trend of the S&P 500 often enough to pay 2R after futures costs."
    symbols: [MES]
    grid:
      adx_min: [20, 25]
      pullback_bars: [4, 8]

  # MES round 2 (declared 2026-10-06, after round 1's results and before any
  # round-2 run). Published index effects, not ideas fitted to round 1, except
  # the long-only channel breakout, which round 1's long/short split suggested
  # and which is therefore held to the extra buy-and-hold benchmark below.
  # Gates are the unchanged T0 gates above. Grids are at most 4 points and are
  # fixed; the stops are fixed (not gridded) because for a time-exit trade the
  # stop sets 1R and position size, and gridding it would rescale R.
  #
  # Time-exit strategies (no profit target, rr: null): R = direction x (exit -
  # entry) / (entry - stop) minus costs / (entry - stop), where the stop is the
  # declared protective stop that would size the position. ``benchmark:
  # buy_and_hold`` adds one gate: average R after costs minus the R that
  # holding the S&P long for the same hours would have earned on the same
  # risk (mean log return per calendar hour over the same OOS windows, no
  # costs) must be > 0.
  mes_intraday_momentum_m30:
    setup: intraday_momentum
    bar: 30min
    hypothesis: "Gao, Han, Li & Zhou (2018): the S&P 500 return from the prior close (or the 09:30 New York open) to 10:00 New York predicts the sign of the last half hour; trading 15:30 New York to the close in that direction pays after futures costs."
    symbols: [MES]
    exits:
      rr: null                   # time exit only (plus the protective stop)
      friday_flatten_utc: null   # the trade closes by 16:00 New York the same day
    filters:
      friday_no_entry_after_utc: null   # intraday: nothing is held over the weekend, so Friday afternoons trade too
    grid:
      signal_from: [prev_close, open]   # first-half-hour return measured from the prior 16:00 close, or from 09:30
      exit_at: ["16:00", "15:55"]       # New York
    # fixed: signal_end 10:00, entry_at 15:30 New York, stop 2.0 x M30 ATR(14) from the 15:30 close
  mes_overnight_drift_h1:
    setup: overnight_drift
    bar: 1h
    hypothesis: "The overnight drift (Cooper, Cliff & Gulen 2008; Boyarchenko, Larsen & Whelan 2023): S&P 500 returns accrue mostly outside US cash hours, so a long held from the 16:00 New York close to the next 09:30 open (or to 04:00, after the European open) earns more than buy-and-hold for the same hours, after futures costs."
    symbols: [MES]
    benchmark: buy_and_hold
    exits:
      rr: null
      friday_flatten_utc: null   # Friday entries are already refused by the unchanged 18:00 UTC Friday entry filter: no weekend holds
    grid:
      exit_at: ["09:30", "04:00"]       # next trading day, New York
    # fixed: entry_at 16:00 New York (H1 close), long only, stop 3.0 x H1 ATR(14) from the 16:00 close
  mes_channel_breakout_long_h4:
    setup: channel_breakout
    bar: 4h
    hypothesis: "Long-only H4 channel breakout on the S&P 500 (a new hypothesis, suggested by round 1's long/short split): upside breakouts pay 2R after futures costs by more than exposure-matched buy-and-hold and random long entries."
    symbols: [MES]
    benchmark: buy_and_hold
    grid:
      channel: [20, 55]
      sl_atr: [1.5, 2.5]
      sides: [long]
  mes_opening_gap_m30:
    setup: opening_gap
    bar: 30min
    hypothesis: "The overnight gap of the S&P 500 (prior 16:00 close to 09:30 New York) is faded, or followed, in the first hour or over the session often enough to pay after futures costs."
    symbols: [MES]
    exits:
      rr: null
      friday_flatten_utc: null   # intraday
    filters:
      friday_no_entry_after_utc: null
    grid:
      mode: [fade, follow]
      exit_at: ["10:30", "15:55"]       # New York, same day
    # fixed: entry at 09:30 New York (M30 close), any non-zero gap, stop 4.0 x M30 ATR(14) from the 09:30 close
