# Internal risk limits for the demo practice run: a $50,000 simulated account, no prop firm.
# Every limit is a share of the practice rule file's own limits (prop_rules/ninjatrader_sim_50k.yaml).
# Contract caps (1 MES per trade, 2 in total) are in that file: max_lot and futures.contract_limit.

risk_per_trade_pct: 0.5            # up to $250 at risk, so a wide opening range still gets its 1 contract
daily_loss_soft_pct_of_firm: 0.50  # no new trades after losing $500 in a day (half the $1,000 daily limit)
daily_loss_hard_pct_of_firm: 0.75
drawdown_stop_pct_of_firm: 0.60    # stop at $1,800 down from the start (60% of the $3,000 limit)
drawdown_halve_pct_of_internal: 0.50
max_open_risk_pct: 0.5
max_currency_risk_pct: 0.5         # futures: per asset group (MES is us_equity_index)
max_trades_per_day: 4              # the opening-range rule makes at most 1; Hermes at most 4 intents
loss_streak_halve_after: 4
loss_streak_halve_trades: 10
reduced_risk_multiplier: 0.5
max_sizing_overshoot: 1.10
correlation:
  threshold: 0.70
  window_days: 60
  max_age_days: 8
  one_bet_max_risk_pct: null
