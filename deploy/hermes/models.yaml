# Model per tier (PRD §5). deploy/hermes/bootstrap.py writes these into each
# profile's config.yaml according to its tier in atlas-profiles/roster.yaml.
# Change a tier here and re-run the bootstrap; nothing else needs editing.
#
# Keys: provider and model are required. base_url is for OpenAI-compatible
# endpoints (provider: custom). The provider's API key comes from the service
# environment, never from this file.

tiers:
  frontier:
    provider: anthropic
    model: claude-opus-5
  mid:
    provider: anthropic
    model: claude-sonnet-5
  cheap:
    provider: anthropic
    model: claude-haiku-4-5-20251001

# Per-persona override (PRD v3 §6): any profile in atlas-profiles/roster.yaml may name its own
# provider and model, which wins over its tier. Any provider Hermes supports works here
# (anthropic, openai, gemini, qwen, deepseek, kimi, or custom with base_url for local models).
# Example:
#   profiles:
#     atlas-research:
#       provider: custom
#       model: qwen3-coder
#       base_url: http://127.0.0.1:8000/v1
profiles: {}
